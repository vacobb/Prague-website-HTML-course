        <h1>Contact Us</h1>

        <p id="instructions">Do you have a place you'd like to see featured on our website? Fill out the form below to let us know about it and we may include it in a later version of our site.</p>
        <br>
        <br>
        <form>
            <fieldset>
                <legend>Send us your suggestions</legend>
                <label for="fname">First Name:</label> 
                    <input type="text" id="fname" name="user_first_name"/>
                <br>
                <br>
                <label for="lname">Last Name:</label> 
                    <input type="text" id="lname" name="user_last_name"/>
                <br>
                <br>
                <label for="email">Email:</label> 
                    <input type="email" id="email" name="user_email"/>
                <br>
                <br>
                <label for="attr_name">Name of attraction:</label> 
                    <input type="text" id="attr_name" name="name_of_attraction"/>
                <br>
                <br>
                <label for="address">Address:</label> 
                    <input type="text" id="address" name="address"/>
                <br>
                <br>
                <label for="explanation">Explanation:</label>
                    <textarea id="explanation" name="explanation" rows="5" cols="33" placeholder="Tell us why you like this place."></textarea>
                <br>
                <br>
                        <button type="submit">Submit</button>
                <br>
                <br>
            </fieldset>
        </form>

    </body>
